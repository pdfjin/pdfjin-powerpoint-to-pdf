[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfjin-powerpoint-to-pdf"
version = "0.1.0"
authors = [
  { name="PDFJin Team", email="support@pdfjin.com" },
]
description = "Convert PowerPoint presentations (PPTX) into PDF by PDFJin"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["pdf", "pdfjin", "cli", "pdf-tools", "document-processing", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Printing",
    "Topic :: Utilities",
]
dependencies = ["python-pptx>=0.6.21"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
"Homepage" = "https://pdfjin.com"
"Online Tool" = "https://pdfjin.com/pages/powerpoint-to-pdf.html"
"Source" = "https://github.com/pdfjin/pdfjin-powerpoint-to-pdf"
"Bug Tracker" = "https://github.com/pdfjin/pdfjin-powerpoint-to-pdf/issues"

[project.scripts]
pdfjin-powerpoint-to-pdf = "pdfjin_powerpoint_to_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdfjin_powerpoint_to_pdf*"]
